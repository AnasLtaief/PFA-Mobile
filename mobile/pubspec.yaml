name: campus_covoiturage
description: A ride-sharing mobile application exclusively for Algerian university students.
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Routing & Navigation
  go_router: ^12.1.3

  # Networking & Sockets
  dio: ^5.4.0
  socket_io_client: ^2.0.3-html.0

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Location & Maps
  google_maps_flutter: ^2.5.3
  geolocator: ^10.1.0

  # Payments
  flutter_stripe: ^9.5.0

  # Media & Icons
  image_picker: ^1.0.7
  cached_network_image: ^3.3.1
  video_player: ^2.8.2
  flutter_svg: ^2.0.9
  cupertino_icons: ^1.0.6

  # Firebase & Notifications
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.10

  # UI Enhancement & Animations
  lottie: ^2.7.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  shake: ^2.2.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
